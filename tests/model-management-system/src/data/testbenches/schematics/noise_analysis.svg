<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Noise Analysis for LNA</text>
  
  <!-- Source Resistance -->
  <g id="rs" transform="translate(60, 150)">
    <rect x="-5" y="-20" width="10" height="40" stroke="black" stroke-width="2" fill="none"/>
    <text x="-5" y="-25" font-family="Arial" font-size="10">RS</text>
    <text x="-5" y="35" font-family="Arial" font-size="10">50Ω</text>
  </g>
  
  <!-- AC Source with noise -->
  <g id="vsource" transform="translate(60, 200)">
    <circle cx="0" cy="0" r="20" stroke="black" stroke-width="2" fill="none"/>
    <path d="M -10,0 Q -5,-5 0,0 T 10,0" stroke="black" stroke-width="2" fill="none"/>
    <text x="-45" y="5" font-family="Arial" font-size="10">VIN+vn</text>
  </g>
  
  <!-- Input coupling capacitor -->
  <g id="cin" transform="translate(110, 150)">
    <line x1="-10" y1="-15" x2="-10" y2="15" stroke="black" stroke-width="2"/>
    <line x1="10" y1="-15" x2="10" y2="15" stroke="black" stroke-width="2"/>
    <text x="-5" y="-20" font-family="Arial" font-size="10">CIN</text>
  </g>
  
  <!-- MOSFET Symbol -->
  <g id="mosfet" transform="translate(200, 150)">
    <!-- Gate -->
    <line x1="-50" y1="0" x2="-20" y2="0" stroke="black" stroke-width="2"/>
    <line x1="-20" y1="-30" x2="-20" y2="30" stroke="black" stroke-width="2"/>
    
    <!-- Channel -->
    <line x1="-10" y1="-30" x2="-10" y2="-10" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="-5" x2="-10" y2="5" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="10" x2="-10" y2="30" stroke="black" stroke-width="2"/>
    
    <!-- Source/Drain -->
    <line x1="-10" y1="-20" x2="20" y2="-20" stroke="black" stroke-width="2"/>
    <line x1="20" y1="-20" x2="20" y2="-50" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="20" x2="20" y2="20" stroke="black" stroke-width="2"/>
    <line x1="20" y1="20" x2="20" y2="50" stroke="black" stroke-width="2"/>
    
    <!-- Bulk -->
    <line x1="-10" y1="0" x2="5" y2="0" stroke="black" stroke-width="2"/>
    <line x1="5" y1="0" x2="5" y2="40" stroke="black" stroke-width="2"/>
    
    <!-- Arrow for NMOS -->
    <polygon points="5,0 10,5 10,-5" fill="black" transform="translate(-12, 0)"/>
    
    <!-- Noise sources indication -->
    <text x="30" y="0" font-family="Arial" font-size="8" fill="red">in²</text>
  </g>
  
  <!-- VDD Supply -->
  <g id="vdd" transform="translate(220, 60)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="black" stroke-width="2"/>
    <text x="30" y="10" font-family="Arial" font-size="12">VDD</text>
  </g>
  
  <!-- Load Inductor (for LNA) -->
  <g id="inductor" transform="translate(220, 85)">
    <!-- Inductor coils -->
    <path d="M 0,-15 Q -5,-10 0,-5 T 0,5 T 0,15" stroke="black" stroke-width="2" fill="none"/>
    <text x="25" y="0" font-family="Arial" font-size="10">LD</text>
  </g>
  
  <!-- Load Capacitor -->
  <g id="load_cap" transform="translate(280, 110)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="black" stroke-width="1"/>
    <line x1="-10" y1="20" x2="10" y2="20" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="25" x2="10" y2="25" stroke="black" stroke-width="2"/>
    <text x="15" y="25" font-family="Arial" font-size="10">CL</text>
    <line x1="0" y1="30" x2="0" y2="50" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Output -->
  <g id="output" transform="translate(320, 110)">
    <circle cx="0" cy="0" r="3" fill="black"/>
    <text x="10" y="5" font-family="Arial" font-size="12">VOUT</text>
  </g>
  
  <!-- Connections -->
  <!-- Source to RS -->
  <line x1="60" y1="180" x2="60" y2="170" stroke="black" stroke-width="1"/>
  <!-- RS to CIN -->
  <line x1="60" y1="130" x2="60" y2="110" stroke="black" stroke-width="1"/>
  <line x1="60" y1="110" x2="100" y2="110" stroke="black" stroke-width="1"/>
  <line x1="100" y1="110" x2="100" y2="150" stroke="black" stroke-width="1"/>
  <!-- CIN to Gate -->
  <line x1="120" y1="150" x2="150" y2="150" stroke="black" stroke-width="1"/>
  
  <!-- VDD to LD -->
  <line x1="220" y1="60" x2="220" y2="70" stroke="black" stroke-width="1"/>
  <!-- LD to Drain -->
  <line x1="220" y1="100" x2="220" y2="130" stroke="black" stroke-width="1"/>
  
  <!-- Drain to output -->
  <line x1="220" y1="110" x2="280" y2="110" stroke="black" stroke-width="1"/>
  <line x1="280" y1="110" x2="320" y2="110" stroke="black" stroke-width="1"/>
  <circle cx="220" cy="110" r="3" fill="black"/>
  
  <!-- Source degeneration inductor -->
  <g id="ls" transform="translate(220, 210)">
    <path d="M 0,-15 Q -5,-10 0,-5 T 0,5 T 0,15" stroke="black" stroke-width="2" fill="none"/>
    <text x="25" y="0" font-family="Arial" font-size="10">LS</text>
  </g>
  
  <!-- Source to LS -->
  <line x1="220" y1="200" x2="220" y2="195" stroke="black" stroke-width="1"/>
  
  <!-- Ground -->
  <g id="ground" transform="translate(220, 250)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="black" stroke-width="2"/>
    <line x1="-15" y1="20" x2="15" y2="20" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="25" x2="10" y2="25" stroke="black" stroke-width="1"/>
    <line x1="-5" y1="30" x2="5" y2="30" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- LS to ground -->
  <line x1="220" y1="225" x2="220" y2="250" stroke="black" stroke-width="1"/>
  
  <!-- Ground for source -->
  <g transform="translate(60, 240)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="1"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="black" stroke-width="2"/>
  </g>
  <line x1="60" y1="220" x2="60" y2="240" stroke="black" stroke-width="1"/>
  
  <!-- Ground for load cap -->
  <g transform="translate(280, 160)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="black" stroke-width="2"/>
  </g>
  
  <!-- Bulk to ground -->
  <line x1="205" y1="190" x2="205" y2="250" stroke="black" stroke-width="1"/>
  
  <!-- Gate bias resistor -->
  <g id="rb" transform="translate(150, 110)">
    <rect x="-20" y="-5" width="40" height="10" stroke="black" stroke-width="1" fill="none"/>
    <text x="-10" y="-10" font-family="Arial" font-size="10">RB</text>
  </g>
  
  <!-- Bias voltage -->
  <g id="vbias" transform="translate(110, 80)">
    <circle cx="0" cy="0" r="15" stroke="black" stroke-width="1" fill="none"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="black" stroke-width="1"/>
    <line x1="-4" y1="-4" x2="4" y2="-4" stroke="black" stroke-width="1"/>
    <line x1="-4" y1="4" x2="4" y2="4" stroke="black" stroke-width="1"/>
    <text x="-40" y="5" font-family="Arial" font-size="10">VBIAS</text>
  </g>
  
  <!-- Connections for bias -->
  <line x1="150" y1="150" x2="150" y2="115" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="150" r="2" fill="black"/>
  <line x1="130" y1="110" x2="110" y2="110" stroke="black" stroke-width="1"/>
  <line x1="110" y1="110" x2="110" y2="95" stroke="black" stroke-width="1"/>
  
  <!-- Bias ground -->
  <g transform="translate(110, 50)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="black" stroke-width="1"/>
    <line x1="-10" y1="15" x2="10" y2="15" stroke="black" stroke-width="2"/>
  </g>
  <line x1="110" y1="65" x2="110" y2="50" stroke="black" stroke-width="1"/>
  
  <!-- Noise Figure annotation -->
  <g transform="translate(320, 200)">
    <rect x="-30" y="-20" width="60" height="40" stroke="orange" stroke-width="1" fill="white" fill-opacity="0.9"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="10" fill="orange">NF @ 1GHz</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="10" fill="orange">NFmin</text>
  </g>
  
  <!-- Labels -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="10" fill="gray">LNA with Source Degeneration - Noise Figure Analysis</text>
</svg>