<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">AC Small Signal Analysis</text>
  
  <!-- MOSFET Symbol -->
  <g id="mosfet" transform="translate(200, 150)">
    <!-- Gate -->
    <line x1="-50" y1="0" x2="-20" y2="0" stroke="black" stroke-width="2"/>
    <line x1="-20" y1="-30" x2="-20" y2="30" stroke="black" stroke-width="2"/>
    
    <!-- Channel -->
    <line x1="-10" y1="-30" x2="-10" y2="-10" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="-5" x2="-10" y2="5" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="10" x2="-10" y2="30" stroke="black" stroke-width="2"/>
    
    <!-- Source/Drain -->
    <line x1="-10" y1="-20" x2="20" y2="-20" stroke="black" stroke-width="2"/>
    <line x1="20" y1="-20" x2="20" y2="-50" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="20" x2="20" y2="20" stroke="black" stroke-width="2"/>
    <line x1="20" y1="20" x2="20" y2="50" stroke="black" stroke-width="2"/>
    
    <!-- Bulk -->
    <line x1="-10" y1="0" x2="5" y2="0" stroke="black" stroke-width="2"/>
    <line x1="5" y1="0" x2="5" y2="40" stroke="black" stroke-width="2"/>
    <line x1="5" y1="40" x2="40" y2="40" stroke="black" stroke-width="2"/>
    
    <!-- Arrow for NMOS -->
    <polygon points="5,0 10,5 10,-5" fill="black" transform="translate(-12, 0)"/>
  </g>
  
  <!-- VDD Supply -->
  <g id="vdd" transform="translate(220, 60)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="black" stroke-width="2"/>
    <text x="30" y="10" font-family="Arial" font-size="12">VDD</text>
  </g>
  
  <!-- Load Resistor -->
  <g id="resistor" transform="translate(220, 80)">
    <rect x="-5" y="-20" width="10" height="40" stroke="black" stroke-width="2" fill="none"/>
    <text x="25" y="5" font-family="Arial" font-size="10">RL</text>
  </g>
  
  <!-- VGS DC Bias -->
  <g id="vgs_dc" transform="translate(80, 150)">
    <circle cx="0" cy="0" r="20" stroke="black" stroke-width="2" fill="none"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="black" stroke-width="2"/>
    <line x1="-5" y1="-5" x2="5" y2="-5" stroke="black" stroke-width="2"/>
    <line x1="-5" y1="5" x2="5" y2="5" stroke="black" stroke-width="2"/>
    <text x="-55" y="5" font-family="Arial" font-size="12">VGS_bias</text>
  </g>
  
  <!-- AC Source -->
  <g id="vac" transform="translate(80, 100)">
    <circle cx="0" cy="0" r="20" stroke="blue" stroke-width="2" fill="none"/>
    <!-- AC symbol (sine wave) -->
    <path d="M -10,0 Q -5,-5 0,0 T 10,0" stroke="blue" stroke-width="2" fill="none"/>
    <text x="-35" y="-25" font-family="Arial" font-size="12" fill="blue">VAC</text>
  </g>
  
  <!-- Coupling Capacitor -->
  <g id="capacitor" transform="translate(130, 150)">
    <line x1="-10" y1="-15" x2="-10" y2="15" stroke="black" stroke-width="2"/>
    <line x1="10" y1="-15" x2="10" y2="15" stroke="black" stroke-width="2"/>
    <text x="-5" y="-20" font-family="Arial" font-size="10">C</text>
  </g>
  
  <!-- Connections -->
  <!-- VGS_bias to VAC -->
  <line x1="80" y1="130" x2="80" y2="120" stroke="black" stroke-width="1"/>
  <!-- VAC to ground -->
  <line x1="80" y1="80" x2="80" y2="60" stroke="black" stroke-width="1"/>
  <line x1="80" y1="60" x2="40" y2="60" stroke="black" stroke-width="1"/>
  <line x1="40" y1="60" x2="40" y2="200" stroke="black" stroke-width="1"/>
  <!-- VGS to capacitor -->
  <line x1="100" y1="150" x2="120" y2="150" stroke="black" stroke-width="1"/>
  <!-- Capacitor to gate -->
  <line x1="140" y1="150" x2="150" y2="150" stroke="black" stroke-width="1"/>
  
  <!-- VDD to RL -->
  <line x1="220" y1="60" x2="220" y2="60" stroke="black" stroke-width="1"/>
  <!-- RL to Drain -->
  <line x1="220" y1="100" x2="220" y2="130" stroke="black" stroke-width="1"/>
  
  <!-- Load Capacitor -->
  <g id="load_cap" transform="translate(270, 110)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="black" stroke-width="1"/>
    <line x1="-10" y1="20" x2="10" y2="20" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="25" x2="10" y2="25" stroke="black" stroke-width="2"/>
    <text x="15" y="25" font-family="Arial" font-size="10">CL</text>
    <line x1="0" y1="30" x2="0" y2="50" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Connection from drain to load cap -->
  <line x1="220" y1="110" x2="270" y2="110" stroke="black" stroke-width="1"/>
  
  <!-- Ground -->
  <g id="ground" transform="translate(220, 220)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="black" stroke-width="2"/>
    <line x1="-15" y1="20" x2="15" y2="20" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="25" x2="10" y2="25" stroke="black" stroke-width="1"/>
    <line x1="-5" y1="30" x2="5" y2="30" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Ground for load cap -->
  <g transform="translate(270, 160)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="black" stroke-width="2"/>
  </g>
  
  <!-- Ground for VGS -->
  <g transform="translate(40, 200)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="black" stroke-width="2"/>
  </g>
  
  <line x1="80" y1="170" x2="80" y2="200" stroke="black" stroke-width="1"/>
  <line x1="80" y1="200" x2="40" y2="200" stroke="black" stroke-width="1"/>
  
  <!-- Source connection to ground -->
  <line x1="220" y1="200" x2="220" y2="220" stroke="black" stroke-width="1"/>
  
  <!-- Bulk to ground -->
  <line x1="240" y1="190" x2="280" y2="190" stroke="black" stroke-width="1"/>
  <line x1="280" y1="190" x2="280" y2="240" stroke="black" stroke-width="1"/>
  <line x1="280" y1="240" x2="220" y2="240" stroke="black" stroke-width="1"/>
  
  <!-- Terminal Labels -->
  <text x="220" y="125" text-anchor="middle" font-family="Arial" font-size="10">D</text>
  <text x="145" y="145" text-anchor="middle" font-family="Arial" font-size="10">G</text>
  <text x="225" y="215" text-anchor="middle" font-family="Arial" font-size="10">S</text>
  <text x="250" y="185" text-anchor="middle" font-family="Arial" font-size="10">B</text>
  
  <!-- Measurement labels -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="10" fill="gray">Extract gm, gds, Cgg at operating point</text>
</svg>