<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">C-V Characterization</text>
  
  <!-- MOSFET Symbol (shown as capacitor structure) -->
  <g id="mosfet_cap" transform="translate(200, 150)">
    <!-- Gate -->
    <line x1="-50" y1="0" x2="-20" y2="0" stroke="black" stroke-width="2"/>
    <line x1="-20" y1="-30" x2="-20" y2="30" stroke="black" stroke-width="2"/>
    
    <!-- Channel (shorted for CV) -->
    <line x1="-10" y1="-30" x2="-10" y2="30" stroke="black" stroke-width="2" stroke-dasharray="5,2"/>
    
    <!-- Source/Drain shorted together -->
    <line x1="-10" y1="-20" x2="20" y2="-20" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="20" x2="20" y2="20" stroke="black" stroke-width="2"/>
    <line x1="20" y1="-20" x2="20" y2="20" stroke="black" stroke-width="2"/>
    <line x1="20" y1="0" x2="40" y2="0" stroke="black" stroke-width="2"/>
    
    <!-- Bulk -->
    <line x1="-10" y1="0" x2="5" y2="0" stroke="black" stroke-width="2"/>
    <line x1="5" y1="0" x2="5" y2="40" stroke="black" stroke-width="2"/>
    <line x1="5" y1="40" x2="40" y2="40" stroke="black" stroke-width="2"/>
    
    <!-- Capacitance symbols -->
    <text x="-35" y="-40" font-family="Arial" font-size="10" fill="blue">Cgg</text>
    <text x="25" y="-10" font-family="Arial" font-size="10" fill="blue">Cgd</text>
    <text x="25" y="20" font-family="Arial" font-size="10" fill="blue">Cgs</text>
    <text x="25" y="50" font-family="Arial" font-size="10" fill="blue">Cgb</text>
  </g>
  
  <!-- VGS DC Source -->
  <g id="vgs_dc" transform="translate(100, 150)">
    <circle cx="0" cy="0" r="20" stroke="black" stroke-width="2" fill="none"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="black" stroke-width="2"/>
    <line x1="-5" y1="-5" x2="5" y2="-5" stroke="black" stroke-width="2"/>
    <line x1="-5" y1="5" x2="5" y2="5" stroke="black" stroke-width="2"/>
    <text x="-40" y="5" font-family="Arial" font-size="12">VGS</text>
  </g>
  
  <!-- VAC Small Signal -->
  <g id="vac" transform="translate(100, 100)">
    <circle cx="0" cy="0" r="20" stroke="purple" stroke-width="2" fill="none"/>
    <path d="M -10,0 Q -5,-5 0,0 T 10,0" stroke="purple" stroke-width="2" fill="none"/>
    <text x="-35" y="-25" font-family="Arial" font-size="12" fill="purple">VAC</text>
    <text x="-45" y="-10" font-family="Arial" font-size="10" fill="purple">1MHz</text>
  </g>
  
  <!-- VDS Source (optional) -->
  <g id="vds" transform="translate(280, 150)">
    <circle cx="0" cy="0" r="20" stroke="black" stroke-width="2" fill="none"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="black" stroke-width="2"/>
    <line x1="-5" y1="-5" x2="5" y2="-5" stroke="black" stroke-width="2"/>
    <line x1="-5" y1="5" x2="5" y2="5" stroke="black" stroke-width="2"/>
    <text x="30" y="5" font-family="Arial" font-size="12">VDS=0V</text>
  </g>
  
  <!-- VBS Source -->
  <g id="vbs" transform="translate(280, 210)">
    <circle cx="0" cy="0" r="20" stroke="black" stroke-width="2" fill="none"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="black" stroke-width="2"/>
    <line x1="-5" y1="-5" x2="5" y2="-5" stroke="black" stroke-width="2"/>
    <line x1="-5" y1="5" x2="5" y2="5" stroke="black" stroke-width="2"/>
    <text x="30" y="5" font-family="Arial" font-size="12">VBS=0V</text>
  </g>
  
  <!-- Connections -->
  <!-- VGS+VAC to gate -->
  <line x1="100" y1="130" x2="100" y2="120" stroke="black" stroke-width="1"/>
  <line x1="100" y1="80" x2="100" y2="60" stroke="black" stroke-width="1"/>
  <line x1="100" y1="60" x2="40" y2="60" stroke="black" stroke-width="1"/>
  <line x1="40" y1="60" x2="40" y2="200" stroke="black" stroke-width="1"/>
  <line x1="120" y1="150" x2="150" y2="150" stroke="black" stroke-width="1"/>
  
  <!-- VDS to drain/source -->
  <line x1="240" y1="150" x2="260" y2="150" stroke="black" stroke-width="1"/>
  
  <!-- VBS to bulk -->
  <line x1="240" y1="190" x2="260" y2="190" stroke="black" stroke-width="1"/>
  
  <!-- Ground -->
  <g id="ground" transform="translate(200, 250)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="black" stroke-width="2"/>
    <line x1="-15" y1="20" x2="15" y2="20" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="25" x2="10" y2="25" stroke="black" stroke-width="1"/>
    <line x1="-5" y1="30" x2="5" y2="30" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Ground connections -->
  <g transform="translate(100, 200)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="1"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke="black" stroke-width="2"/>
    <line x1="-10" y1="20" x2="10" y2="20" stroke="black" stroke-width="2"/>
  </g>
  <line x1="100" y1="170" x2="100" y2="200" stroke="black" stroke-width="1"/>
  <line x1="40" y1="200" x2="100" y2="200" stroke="black" stroke-width="1"/>
  
  <g transform="translate(280, 250)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="1"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="black" stroke-width="2"/>
  </g>
  <line x1="280" y1="170" x2="280" y2="180" stroke="black" stroke-width="1"/>
  <line x1="280" y1="180" x2="320" y2="180" stroke="black" stroke-width="1"/>
  <line x1="320" y1="180" x2="320" y2="250" stroke="black" stroke-width="1"/>
  <line x1="320" y1="250" x2="280" y2="250" stroke="black" stroke-width="1"/>
  
  <line x1="280" y1="230" x2="280" y2="250" stroke="black" stroke-width="1"/>
  
  <!-- Current measurement for capacitance -->
  <g transform="translate(150, 120)">
    <circle cx="0" cy="0" r="12" stroke="purple" stroke-width="2" fill="none"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="purple">I(VAC)</text>
  </g>
  <line x1="150" y1="150" x2="150" y2="132" stroke="black" stroke-width="1"/>
  <line x1="150" y1="108" x2="150" y2="60" stroke="black" stroke-width="1"/>
  <line x1="150" y1="60" x2="100" y2="60" stroke="black" stroke-width="1"/>
  
  <!-- Capacitance extraction formula -->
  <g transform="translate(320, 80)">
    <rect x="-40" y="-20" width="80" height="40" stroke="blue" stroke-width="1" fill="white" fill-opacity="0.9"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="9" fill="blue">C = Im(I(VAC))</text>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="blue" stroke-width="1"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="9" fill="blue">2πf × VAC</text>
  </g>
  
  <!-- C-V curve sketch -->
  <g transform="translate(60, 230)">
    <text x="0" y="-35" font-family="Arial" font-size="9" fill="gray">C-V Curve</text>
    <line x1="-20" y1="0" x2="30" y2="0" stroke="gray" stroke-width="1"/>
    <line x1="-20" y1="0" x2="-20" y2="-30" stroke="gray" stroke-width="1"/>
    <path d="M -20,-5 Q -10,-20 0,-20 T 20,-10 L 30,-10" stroke="blue" stroke-width="1.5" fill="none"/>
    <text x="35" y="5" font-family="Arial" font-size="8" fill="gray">VGS</text>
    <text x="-35" y="-15" font-family="Arial" font-size="8" fill="gray">Cgg</text>
  </g>
  
  <!-- Labels -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="10" fill="gray">Gate Capacitance vs Voltage Extraction</text>
</svg>