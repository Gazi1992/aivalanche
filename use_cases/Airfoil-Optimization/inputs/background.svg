<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" version="1.1">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003300;stop-opacity:1" />
    </linearGradient>
    
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#004d00" stroke-width="0.2" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Base background -->
  <rect width="800" height="800" fill="url(#bgGradient)"/>
  
  <!-- Grid overlay -->
  <rect width="800" height="800" fill="url(#grid)"/>
  
  <!-- Altitude contour circles -->
  <g stroke="#00ff00" fill="none" opacity="0.1">
    <circle cx="400" cy="400" r="350" stroke-width="0.5"/>
    <circle cx="400" cy="400" r="300" stroke-width="0.5"/>
    <circle cx="400" cy="400" r="250" stroke-width="0.5"/>
    <circle cx="400" cy="400" r="200" stroke-width="0.5"/>
  </g>

  <!-- Compass rose -->
  <g stroke="#00ff00" fill="none" opacity="0.15">
    <circle cx="100" cy="700" r="30"/>
    <line x1="70" y1="700" x2="130" y2="700" stroke-width="0.5"/>
    <line x1="100" y1="670" x2="100" y2="730" stroke-width="0.5"/>
  </g>

  <!-- Flight paths -->
  <g stroke="#00ff00" stroke-width="0.8" fill="none" opacity="0.15">
    <path d="M 0 300 Q 400 350, 800 250" stroke-dasharray="5,5"/>
    <path d="M 800 500 Q 400 450, 0 550" stroke-dasharray="5,5"/>
  </g>

  <!-- Digital circuit lines -->
  <g stroke="#00ff00" fill="none">
    <path d="M 0 400 Q 200 350, 400 400 T 800 400" stroke-width="1" opacity="0.15"/>
    <path d="M 0 300 Q 300 250, 500 300 T 800 300" stroke-width="0.8" opacity="0.1"/>
  </g>
  
  <!-- Coordinate markers -->
  <g fill="#00ff00" opacity="0.2">
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="12">+x</text>
    <text x="750" y="50" font-family="Arial, sans-serif" font-size="12">-x</text>
    <text x="50" y="750" font-family="Arial, sans-serif" font-size="12">+y</text>
    <text x="750" y="750" font-family="Arial, sans-serif" font-size="12">-y</text>
  </g>

  <!-- Navigation points -->
  <g fill="#00ff00">
    <circle cx="100" cy="100" r="1.5" opacity="0.3"/>
    <circle cx="300" cy="200" r="1" opacity="0.2"/>
    <circle cx="500" cy="150" r="1.5" opacity="0.25"/>
    <circle cx="700" cy="250" r="1" opacity="0.2"/>
    <circle cx="200" cy="600" r="1.5" opacity="0.3"/>
    <circle cx="600" cy="550" r="1" opacity="0.2"/>
    <circle cx="400" cy="700" r="1.5" opacity="0.25"/>
  </g>

  <!-- Angle markers -->
  <g stroke="#00ff00" fill="none" opacity="0.2">
    <path d="M 650 100 A 30 30 0 0 1 680 130" stroke-width="0.5"/>
    <path d="M 150 650 A 30 30 0 0 1 180 680" stroke-width="0.5"/>
  </g>
  
  <!-- Additional tech elements -->
  <g stroke="#00ff00" fill="none" opacity="0.1">
    <path d="M 150 250 l 30 17.32 l 0 34.64 l -30 17.32 l -30 -17.32 l 0 -34.64 z"/>
    <path d="M 650 550 l 30 17.32 l 0 34.64 l -30 17.32 l -30 -17.32 l 0 -34.64 z"/>
    <path d="M 400 150 l 30 17.32 l 0 34.64 l -30 17.32 l -30 -17.32 l 0 -34.64 z"/>
    <path d="M 400 650 l 30 17.32 l 0 34.64 l -30 17.32 l -30 -17.32 l 0 -34.64 z"/>
  </g>
</svg>